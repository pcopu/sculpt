name: Bake coffee scene
on:
  push:
    paths: ['.github/workflows/prepare.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: coffee-bake
  cancel-in-progress: true
jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RENDER_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install pinned Blender
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo '/tmp/blender-4.3.2-linux-x64' >> "$GITHUB_PATH"
          mkdir -p public/vendor
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js -o public/vendor/three.module.js
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.core.js -o public/vendor/three.core.js
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/three@0.180.0/LICENSE -o public/vendor/THREE-LICENSE.txt
      - name: Apply tested liquid containment settings
        run: |
          python tools/refine_simulation.py
          git config user.name 'sculpt-render-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_scene.py
          git commit -m 'Apply stable cup collisions and fitted liquid volume' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Build original scene
        run: blender -b -t 4 --python tools/build_scene.py -- --mode build --resolution 160
      - name: Simulate liquid with early containment regression checks
        run: python tools/bake_checked.py
      - name: Export Three.js geometry and liquid frames
        run: blender -b -t 4 --python tools/build_scene.py -- --mode export
      - name: Verify all meshes and physical floor impact
        run: python tools/validate_cache.py
      - name: Package the baked scene
        run: |
          tar -czf render-cache.tgz render/coffee.blend render/cache public/assets
          du -sh render-cache.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: render-cache
          path: render-cache.tgz
          compression-level: 0
          retention-days: 14
      - name: Commit generated Three.js assets
        run: |
          git add public/assets public/vendor
          git commit -m 'Publish contained FLIP coffee simulation and shared Three.js assets'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Render inspection frames
        run: blender -b -t 4 --python tools/render_shard.py -- --mode preview --width 960 --samples 16
      - uses: actions/upload-artifact@v4
        with:
          name: inspection-frames
          path: render/preview
          retention-days: 14
